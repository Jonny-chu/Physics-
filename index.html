<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Gravity & Orbit Lab</title>
    <style>
        body {
            margin: 0;
            background: #0b0f19;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 12px 20px;
            background: #111827;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin: 0;
            font-size: 1.1rem;
            color: #60a5fa;
            font-weight: 600;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        canvas {
            flex-grow: 1;
            display: block;
            background: #000;
            cursor: crosshair;
        }
        .instructions {
            font-size: 0.85rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <header>
        <h1>Gravity & Orbit Simulator</h1>
        <div class="controls">
            <span class="instructions">✨ Click and drag anywhere to launch a new planet!</span>
            <button onclick="resetSimulation()">Reset System</button>
        </div>
    </header>
    
    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 55;
        }
        window.addEventListener('resize', resize);
        resize();

        let bodies = [];
        const G = 1;

        class Body {
            constructor(x, y, vx, vy, mass, radius, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = mass;
                this.radius = radius;
                this.color = color;
                this.trail = [];
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > 150) this.trail.shift();
            }
            draw() {
                // Draw orbit trail
                ctx.beginPath();
                for (let i = 0; i < this.trail.length; i++) {
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = (i / this.trail.length) * 0.25;
                    ctx.fillRect(this.trail[i].x, this.trail[i].y, 2, 2);
                }
                ctx.globalAlpha = 1.0;

                // Draw body
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        function resetSimulation() {
            bodies = [
                // Central Star
                new Body(canvas.width / 2, canvas.height / 2, 0, 0, 1200, 24, '#fbbf24')
            ];
            // Pre-load an orbiting planet
            bodies.push(new Body(canvas.width / 2, canvas.height / 2 - 200, 2.45, 0, 10, 6, '#60a5fa'));
        }

        resetSimulation();

        // Drag-to-launch mechanics
        let isDragging = false;
        let startX, startY;
        let currentX, currentY;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            currentX = startX;
            currentY = startY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            currentX = e.clientX - rect.left;
            currentY = e.clientY - rect.top;
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            // Velocity vector proportional to drag distance and direction
            const vx = (currentX - startX) * 0.04;
            const vy = (currentY - startY) * 0.04;
            
            // Randomize planet color slightly
            const colors = ['#34d399', '#f472b6', '#38bdf8', '#fb923c', '#a78bfa'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            bodies.push(new Body(startX, startY, vx, vy, 8, 5, randomColor));
        });

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Calculate N-body gravitational forces
            for (let i = 0; i < bodies.length; i++) {
                for (let j = i + 1; j < bodies.length; j++) {
                    let b1 = bodies[i];
                    let b2 = bodies[j];
                    let dx = b2.x - b1.x;
                    let dy = b2.y - b1.y;
                    let distSq = dx * dx + dy * dy + 200; // Softening factor to prevent division by zero infinity
                    let dist = Math.sqrt(distSq);
                    
                    let force = (G * b1.mass * b2.mass) / distSq;
                    
                    let fx = force * (dx / dist);
                    let fy = force * (dy / dist);

                    b1.vx += fx / b1.mass;
                    b1.vy += fy / b1.mass;
                    b2.vx -= fx / b2.mass;
                    b2.vy -= fy / b2.mass;
                }
            }

            // Update & render all bodies
            bodies.forEach(b => {
                b.update();
                b.draw();
            });

            // Draw drag vector line preview
            if (isDragging) {
                ctx.strokeStyle = '#34d399';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(currentX, currentY);
                ctx.stroke();
                ctx.setLineDash([]);

                // Preview launch point
                ctx.beginPath();
                ctx.arc(startX, startY, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#34d399';
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
